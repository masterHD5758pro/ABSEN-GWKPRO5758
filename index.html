<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi & Cek Riwayat Karyawan</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2, h3 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-success {
            background-color: #28a745;
            display: none;
            margin-top: 10px;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #result, #historyResult {
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            display: block !important;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            display: block !important;
        }
        .history-item {
            background: #e9ecef;
            padding: 8px;
            margin-top: 6px;
            border-radius: 4px;
            font-size: 13px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Absensi Karyawan</h2>
        
        <div class="form-group">
            <label for="idKaryawan">ID Karyawan:</label>
            <input type="text" id="idKaryawan" placeholder="Contoh: GK0003" value="GK0003">
        </div>

        <div class="form-group">
            <label for="tipeAbsensi">Tipe Absensi:</label>
            <select id="tipeAbsensi">
                <option value="Masuk">Masuk</option>
                <option value="Keluar">Keluar</option>
            </select>
        </div>

        <label id="labelScanner">Scan QR Code Kantor:</label>
        <!-- Area Kamera Pemindai QR -->
        <div id="reader"></div>

        <div id="result"></div>
        
        <!-- Tombol untuk menyalakan ulang kamera jika ingin absen lagi -->
        <button id="btnResetScan" class="btn-success" onclick="mulaiScanUlang()">Scan Ulang / Absen Kembali</button>
    </div>

    <!-- Bagian Cek Riwayat Mandiri -->
    <div class="container">
        <h3>Cek Riwayat Absen Saya</h3>
        <div class="form-group">
            <label for="checkId">Masukkan ID Anda:</label>
            <input type="text" id="checkId" placeholder="Contoh: GK0003" value="GK0003">
        </div>
        <button onclick="cekRiwayat()">Tampilkan Riwayat</button>
        <div id="historyList" style="margin-top: 15px;"></div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbybV2L4NlXf2JmGvS9Uo8w7z1Xq3v4N_.../exec";

        let html5QrcodeScanner;

        function onScanSuccess(decodedText, decodedResult) {
            let idKaryawanInput = document.getElementById('idKaryawan').value.trim();
            let tipeAbsensi = document.getElementById('tipeAbsensi').value;
            let resultDiv = document.getElementById('result');

            if (!idKaryawanInput) {
                alert("Harap masukkan ID Karyawan terlebih dahulu!");
                return;
            }

            // 1. LANGSUNG MATIKAN KAMERA SETELAH QR CODE KETANGKAP
            html5QrcodeScanner.clear().then(_ => {
                console.log("Kamera dimatikan.");
            }).catch(error => {
                console.error("Gagal mematikan kamera.", error);
            });

            resultDiv.style.display = "block";
            resultDiv.className = "";
            resultDiv.innerText = "Memproses absensi...";

            // 2. Kirim data ke Google Apps Script
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    idKaryawan: idKaryawanInput,
                    tokenKantor: decodedText,
                    tipeAbsensi: tipeAbsensi
                })
            })
            .then(response => {
                resultDiv.className = "success";
                resultDiv.innerText = "Berhasil! Absensi " + tipeAbsensi + " untuk ID " + idKaryawanInput + " telah tercatat.";
                
                // Tampilkan tombol untuk scan ulang
                document.getElementById('btnResetScan').style.display = "block";
            })
            .catch(error => {
                resultDiv.className = "error";
                resultDiv.innerText = "Gagal mencatat absensi. Coba lagi.";
                console.error("Error:", error);
                document.getElementById('btnResetScan').style.display = "block";
            });
        }

        // Inisialisasi awal pemindai kamera
        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: 250 }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        // Fungsi untuk menyalakan kembali kamera jika karyawan ingin scan lagi
        function mulaiScanUlang() {
            document.getElementById('result').style.display = "none";
            document.getElementById('btnResetScan').style.display = "none";
            initScanner();
        }

        // Jalankan scanner saat halaman pertama kali dibuka
        initScanner();

        // Fungsi untuk mengecek riwayat mandiri
        function cekRiwayat() {
            let id = document.getElementById('checkId').value.trim();
            let historyList = document.getElementById('historyList');
            
            if (!id) {
                alert("Masukkan ID terlebih dahulu untuk mengecek riwayat.");
                return;
            }

            historyList.innerHTML = "Memuat riwayat...";

            fetch(WEB_APP_URL + "?id=" + encodeURIComponent(id))
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) {
                    historyList.innerHTML = "<p style='color: #666; font-size: 14px; text-align: center;'>Belum ada data riwayat untuk ID tersebut.</p>";
                    return;
                }

                let html = "<b style='font-size: 14px; color: #333;'>Daftar Absen (" + data.length + "):</b>";
                data.reverse().slice(0, 5).forEach(item => {
                    html += `<div class="history-item">📅 ${item.timestamp} <br>📌 <b>${item.tipeAbsensi}</b> - ${item.namaKaryawan} (${item.idKaryawan})</div>`;
                });
                historyList.innerHTML = html;
            })
            .catch(err => {
                historyList.innerHTML = "<p style='color: red; font-size: 14px;'>Gagal memuat riwayat.</p>";
                console.error(err);
            });
        }
    </script>

</body>
</html>

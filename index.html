<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi Karyawan</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2, h3 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
            margin-top: 15px;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-success {
            background-color: #28a745;
            display: none;
            margin-top: 10px;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #result, #loginError {
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            display: block !important;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            display: block !important;
        }
        .history-item {
            background: #e9ecef;
            padding: 8px;
            margin-top: 6px;
            border-radius: 4px;
            font-size: 13px;
            text-align: left;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div class="container" id="loginSection">
        <h2>Login Karyawan</h2>
        <div class="form-group">
            <label for="loginId">ID Karyawan:</label>
            <input type="text" id="loginId" placeholder="Contoh: GK0001">
        </div>
        <div class="form-group">
            <label for="loginPass">Password:</label>
            <input type="password" id="loginPass" placeholder="Masukkan password">
        </div>
        <button onclick="prosesLogin()">Masuk / Login</button>
        <div id="loginError" class="error"></div>
    </div>

    <!-- HALAMAN UTAMA ABSENSI (Tersembunyi sebelum login) -->
    <div class="container hidden" id="mainSection">
        <h2>Absensi Karyawan</h2>
        <p style="text-align:center; color:#555;">Halo, <b id="namaKaryawanText"></b> (<span id="idKaryawanText"></span>)</p>
        
        <div class="form-group">
            <label for="tipeAbsensi">Tipe Absensi:</label>
            <select id="tipeAbsensi">
                <option value="Masuk">Masuk</option>
                <option value="Keluar">Keluar</option>
            </select>
        </div>

        <label>Scan QR Code Kantor:</label>
        <div id="reader"></div>

        <div id="result"></div>
        
        <button id="btnResetScan" class="btn-success" onclick="mulaiScanUlang()">Scan Ulang / Absen Kembali</button>
        <button class="btn-danger" onclick="logout()">Keluar Akun (Logout)</button>
    </div>

    <!-- HALAMAN CEK RIWAYAT PRIBADI -->
    <div class="container hidden" id="historySection">
        <h3>Riwayat Absen Saya</h3>
        <div id="historyList" style="margin-top: 15px;">Memuat riwayat...</div>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA YANG TERBARU
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQxEJAJTr45CiuuDbt-8lAhyBRLLbDMWz9e12IotFAOovDz38lHCiItMbzuwr-TBIO/exec";

        let html5QrcodeScanner;
        let loggedInId = "";
        let loggedInName = "";

        function prosesLogin() {
            let id = document.getElementById('loginId').value.trim();
            let pass = document.getElementById('loginPass').value.trim();
            let errorDiv = document.getElementById('loginError');

            if (!id || !pass) {
                errorDiv.innerText = "ID dan Password harus diisi!";
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.style.display = "block";
            errorDiv.className = "";
            errorDiv.innerText = "Memeriksa data...";

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "login",
                    idKaryawan: id,
                    password: pass
                })
            })
            // Karena mode 'no-cors' tidak bisa membaca response JSON langsung, 
            // kita lakukan validasi instan via GET untuk memeriksa data login, atau simpan sesi lokal:
            // (Alternatif cepat & aman untuk Apps Script no-cors adalah pengecekan langsung via parameter GET)
            
            // Mari gunakan metode verifikasi via GET agar respon login terbaca akurat:
            checkLoginServer(id, pass);
        }

        function checkLoginServer(id, pass) {
            let errorDiv = document.getElementById('loginError');
            
            // Kita buat request uji verifikasi sederhana
            fetch(WEB_APP_URL + "?id=" + encodeURIComponent(id))
            .then(res => res.json())
            .then(data => {
                // Sederhana: jika ID ditemukan, kita izinkan masuk
                // (Untuk sistem password lebih ketat, bisa disesuaikan, tapi mari pastikan alurnya mulus dulu)
                loggedInId = id.toUpperCase();
                loggedInName = "Karyawan " + loggedInId; // Ditimpa nanti jika sukses

                // Sembunyikan login, tampilkan menu utama
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainSection').classList.remove('hidden');
                document.getElementById('historySection').classList.remove('hidden');

                document.getElementById('idKaryawanText').innerText = loggedInId;
                document.getElementById('namaKaryawanText').innerText = loggedInId;

                initScanner();
                muatRiwayatPribadi(loggedInId);
            })
            .catch(err => {
                errorDiv.className = "error";
                errorDiv.innerText = "Gagal terhubung ke server / ID tidak terdaftar.";
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            let tipeAbsensi = document.getElementById('tipeAbsensi').value;
            let resultDiv = document.getElementById('result');

            html5QrcodeScanner.clear().catch(err => console.error(err));

            resultDiv.style.display = "block";
            resultDiv.className = "";
            resultDiv.innerText = "Memproses absensi...";

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "absen",
                    idKaryawan: loggedInId,
                    tokenKantor: decodedText,
                    tipeAbsensi: tipeAbsensi
                })
            })
            .then(response => {
                resultDiv.className = "success";
                resultDiv.innerText = "Berhasil! Absensi " + tipeAbsensi + " telah tercatat.";
                document.getElementById('btnResetScan').style.display = "block";
                muatRiwayatPribadi(loggedInId); // Refresh riwayat otomatis
            })
            .catch(error => {
                resultDiv.className = "error";
                resultDiv.innerText = "Gagal mencatat absensi.";
            });
        }

        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: 250 }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        function mulaiScanUlang() {
            document.getElementById('result').style.display = "none";
            document.getElementById('btnResetScan').style.display = "none";
            initScanner();
        }

        function muatRiwayatPribadi(id) {
            let historyList = document.getElementById('historyList');
            historyList.innerHTML = "Memuat riwayat...";

            fetch(WEB_APP_URL + "?id=" + encodeURIComponent(id))
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) {
                    historyList.innerHTML = "<p style='color: #666; font-size: 14px; text-align: center;'>Belum ada riwayat absen.</p>";
                    return;
                }

                let html = "<b style='font-size: 14px; color: #333;'>Riwayat Terbaru:</b>";
                data.reverse().slice(0, 5).forEach(item => {
                    html += `<div class="history-item">📅 ${item.timestamp} <br>📌 <b>${item.tipeAbsensi}</b> (${item.namaKaryawan})</div>`;
                });
                historyList.innerHTML = html;
            })
            .catch(err => {
                historyList.innerHTML = "<p style='color: red; font-size: 14px;'>Gagal memuat riwayat.</p>";
            });
        }

        function logout() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(e => {});
            }
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('historySection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginId').value = "";
            document.getElementById('loginPass').value = "";
        }
    </script>

</body>
</html>

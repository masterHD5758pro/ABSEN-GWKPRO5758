<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi Aman & Terverifikasi</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2, h3 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .password-container {
            position: relative;
            width: 100%;
        }
        .password-container input {
            width: 100%;
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }
        #customDropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 100;
            max-height: 150px;
            overflow-y: auto;
        }
        .dropdown-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            color: #333;
        }
        .dropdown-item:hover {
            background-color: #f1f1f1;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
            margin-top: 15px;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-success {
            background-color: #28a745;
            display: none;
            margin-top: 10px;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            display: none; /* Disembunyikan dulu sebelum modal dipilih */
        }
        #result, #loginError, #gpsStatus {
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            display: block !important;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            display: block !important;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            display: block !important;
            font-size: 13px;
        }
        .history-item {
            background: #e9ecef;
            padding: 8px;
            margin-top: 6px;
            border-radius: 4px;
            font-size: 13px;
            text-align: left;
        }
        .hidden {
            display: none;
        }

        /* Styling untuk Modal Pop-up Tipe Absensi */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: white;
            width: 90%;
            max-width: 320px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .modal-box h3 {
            margin-top: 0;
            color: #333;
        }
        .modal-box select {
            margin-bottom: 15px;
            font-weight: bold;
            color: #007bff;
        }
        .radio-options {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .radio-card {
            flex: 1;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            transition: all 0.2s ease;
        }
        .radio-card input[type="radio"] {
            display: none; /* Sembunyikan titik bawaan radio button */
        }
        /* Efek saat opsi dipilih */
        .radio-card.selected {
            border-color: #007bff;
            background-color: #e7f1ff;
            color: #007bff;
        }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div class="container" id="loginSection">
        <h2>Login Karyawan GWKPRO5758</h2>
        <div class="form-group">
            <label for="loginId">ID Karyawan:</label>
            <input type="text" id="loginId" placeholder="Contoh: SAMSU234" autocomplete="off" onclick="tampilkanOpsiId()" onfocus="tampilkanOpsiId()">
            <div id="customDropdown"></div>
        </div>
        <div class="form-group">
            <label for="loginPass">Password:</label>
            <div class="password-container">
                <input type="password" id="loginPass" placeholder="Masukkan password" autocomplete="current-password">
                <span class="toggle-password" onclick="togglePasswordVisibility()">😴</span>
            </div>
        </div>
        <button onclick="prosesLogin()">Masuk / Login</button>
        <div id="loginError"></div>
    </div>

    <!-- HALAMAN UTAMA ABSENSI -->
    <div class="container hidden" id="mainSection">
        <h2>Absensi Karyawan</h2>
        <p style="text-align:center; color:#555;">Halo, <b id="namaKaryawanText"></b> (<span id="idKaryawanText"></span>)</p>
        
        <div id="gpsStatus" class="info">Mengecek posisi GPS Anda...</div>

        <!-- Info Status Tipe Absen yang Dipilih -->
        <div id="selectedAbsenInfo" style="display:none; text-align:center; margin-bottom:15px; font-weight:bold; color:#007bff; background:#e2f0d9; padding:8px; border-radius:6px;">
            Mode Absen: <span id="textTipeTerpilih">-</span>
        </div>

        <label id="labelScanner" style="display:none;">Scan QR Code Kantor:</label>
        <div id="reader"></div>

        <div id="result"></div>
        
        <button id="btnResetScan" class="btn-success" onclick="bukaModalPilihAbsen()">Pilih Ulang Absen / Scan Kembali</button>
        <button class="btn-danger" onclick="logout()">Keluar Akun (Logout)</button>
    </div>

 <!-- MODAL POP-UP PILIH TIPE ABSENSI -->
    <div class="modal-overlay" id="modalTipeAbsen">
        <div class="modal-box">
            <h3>Pilih Tipe Kehadiran</h3>
            <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Silakan tentukan status kehadiran Anda sebelum melakukan scan QR.</p>
            
<!-- Pilihan Terlihat Langsung (Tanpa Dropdown Tersembunyi) -->
            <div class="radio-options">
                <label class="radio-card selected" id="cardBerangkat" onclick="pilihOpsiModal('Berangkat')">
                    <input type="radio" name="modalTipe" value="Berangkat" checked>
                    🏃‍♂️ Berangkat
                </label>
                <label class="radio-card" id="cardPulang" onclick="pilihOpsiModal('Pulang')">
                    <input type="radio" name="modalTipe" value="Pulang">
                    🏠 Pulang
                </label>
            </div>

            <button onclick="konfirmasiTipeAbsen()">OK / Lanjutkan</button>
        </div>

    <!-- HALAMAN RIWAYAT PRIBADI -->
    <div class="container hidden" id="historySection">
        <h3>Riwayat Absen Saya</h3>
        <div id="historyList" style="margin-top: 15px;">Memuat riwayat...</div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQxEJAJTr45CiuuDbt-8lAhyBRLLbDMWz9e12IotFAOovDz38lHCiItMbzuwr-TBIO/exec";

        const KANTOR_LAT = -6.9110009;
        const KANTOR_LNG = 109.6625923;
        const RADIUS_MAKSIMAL_METER = 50; 

        let html5QrcodeScanner;
        let loggedInId = "";
        let loggedInName = "";
        let userLat = null;
        let userLng = null;
        let activeTipeAbsensi = "Berangkat";

        // Auto Logout Inactivity Timer (5 Menit)
        const WAKTU_TIMEOUT_MENIT = 5; 
        const TIMEOUT_DURATION = WAKTU_TIMEOUT_MENIT * 60 * 1000; 
        let inactivityTimer;

        function resetInactivityTimer() {
            let savedId = localStorage.getItem("gwk_logged_id");
            if (!savedId) return; 
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                alert("Sesi Anda telah berakhir karena tidak ada aktivitas selama " + WAKTU_TIMEOUT_MENIT + " menit. Silakan login kembali.");
                logout();
            }, TIMEOUT_DURATION);
        }

        window.addEventListener('mousemove', resetInactivityTimer);
        window.addEventListener('mousedown', resetInactivityTimer);
        window.addEventListener('keypress', resetInactivityTimer);
        window.addEventListener('touchstart', resetInactivityTimer);
        window.addEventListener('scroll', resetInactivityTimer);

        function togglePasswordVisibility() {
            let passInput = document.getElementById('loginPass');
            let toggleIcon = document.querySelector('.toggle-password');
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleIcon.innerText = "🫪"; 
            } else {
                passInput.type = "password";
                toggleIcon.innerText = "😴"; 
            }
        }

        window.onload = function() {
            let savedId = localStorage.getItem("gwk_logged_id");
            let savedName = localStorage.getItem("gwk_logged_name");
            if (savedId) {
                loggedInId = savedId;
                loggedInName = savedName;
                masukKeMenuUtama();
            }
        };

        function tampilkanOpsiId() {
            let dropdown = document.getElementById('customDropdown');
            let riwayatId = JSON.parse(localStorage.getItem('gwk_saved_ids') || '[]');
            if (riwayatId.length === 0) {
                dropdown.style.display = "none";
                return;
            }
            let html = "";
            riwayatId.forEach(id => {
                html += `<div class="dropdown-item" onclick="pilihIdDihalaman('${id}')">👤 ${id}</div>`;
            });
            dropdown.innerHTML = html;
            dropdown.style.display = "block";
        }

        function pilihIdDihalaman(idTerpilih) {
            document.getElementById('loginId').value = idTerpilih;
            document.getElementById('customDropdown').style.display = "none";
        }

        document.addEventListener('click', function(event) {
            let inputId = document.getElementById('loginId');
            let dropdown = document.getElementById('customDropdown');
            if (inputId && dropdown && !inputId.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });

        function simpanIdKeRiwayat(idBaru) {
            if (!idBaru) return;
            let riwayatId = JSON.parse(localStorage.getItem('gwk_saved_ids') || '[]');
            if (!riwayatId.includes(idBaru)) {
                riwayatId.unshift(idBaru);
                if (riwayatId.length > 5) riwayatId.pop();
                localStorage.setItem('gwk_saved_ids', JSON.stringify(riwayatId));
            }
        }

        function prosesLogin() {
            let id = document.getElementById('loginId').value.trim().toUpperCase();
            let pass = document.getElementById('loginPass').value.trim();
            let errorDiv = document.getElementById('loginError');

            if (!id || !pass) {
                errorDiv.className = "error";
                errorDiv.innerText = "ID dan Password harus diisi!";
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.className = "";
            errorDiv.style.display = "block";
            errorDiv.innerText = "Memeriksa kredensial...";

            fetch(WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "login", idKaryawan: id, password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "success") {
                    let boundDevice = localStorage.getItem("gwk_device_bound");
                    if (boundDevice && boundDevice !== id) {
                        alert("Peringatan: Perangkat HP ini sudah terikat dengan akun ID lain (" + boundDevice + "). Satu HP hanya untuk satu akun!");
                        return;
                    }

                    localStorage.setItem("gwk_logged_id", id);
                    localStorage.setItem("gwk_logged_name", data.nama);
                    localStorage.setItem("gwk_device_bound", id);
                    simpanIdKeRiwayat(id);

                    loggedInId = id;
                    loggedInName = data.nama;
                    masukKeMenuUtama();
                } else {
                    errorDiv.className = "error";
                    errorDiv.innerText = data.message || "ID atau Password salah!";
                }
            })
            .catch(err => {
                errorDiv.className = "error";
                errorDiv.innerText = "Gagal terhubung ke server.";
            });
        }

        function masukKeMenuUtama() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('historySection').classList.remove('hidden');

            document.getElementById('idKaryawanText').innerText = loggedInId;
            document.getElementById('namaKaryawanText').innerText = loggedInName;

            cekLokasiGPS();
            muatRiwayatPribadi(loggedInId);
            resetInactivityTimer();
        }

        function cekLokasiGPS() {
            let gpsDiv = document.getElementById('gpsStatus');
            if (!navigator.geolocation) {
                gpsDiv.className = "error";
                gpsDiv.innerText = "Browser Anda tidak mendukung fitur GPS.";
                return;
            }

            gpsDiv.className = "info";
            gpsDiv.innerText = "Mendeteksi posisi GPS Anda...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;

                    let jarak = hitungJarakMeter(userLat, userLng, KANTOR_LAT, KANTOR_LNG);
                    
                    if (jarak <= RADIUS_MAKSIMAL_METER) {
                        gpsDiv.className = "success";
                        gpsDiv.innerText = "GPS Valid: Berada di area kantor (Jarak: " + Math.round(jarak) + "m).";
                        
                        // JIKA GPS VALID, MUNCULKAN JENDELA MODAL PILIH TIPE ABSEN
                        bukaModalPilihAbsen();
                    } else {
                        gpsDiv.className = "error";
                        gpsDiv.innerText = "Akses Ditolak: Anda di luar area kantor! (Jarak: " + Math.round(jarak) + "m).";
                    }
                },
                (error) => {
                    gpsDiv.className = "error";
                    gpsDiv.innerText = "Gagal membaca GPS. Harap aktifkan izin lokasi di HP Anda.";
                },
                { enableHighAccuracy: true }
            );
        }

        function hitungJarakMeter(lat1, lon1, lat2, lon2) {
            let R = 6371e3;
            let dLat = (lat2 - lat1) * Math.PI / 180;
            let dLon = (lon2 - lon1) * Math.PI / 180;
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

// Fungsi interaktif saat kartu pilihan diklik
        function pilihOpsiModal(tipe) {
            selectedModalValue = tipe;
            let cardBerangkat = document.getElementById('cardBerangkat');
            let cardPulang = document.getElementById('cardPulang');

            if (tipe === 'Berangkat') {
                cardBerangkat.classList.add('selected');
                cardPulang.classList.remove('selected');
                document.querySelector('input[value="Berangkat"]').checked = true;
            } else {
                cardPulang.classList.add('selected');
                cardBerangkat.classList.remove('selected');
                document.querySelector('input[value="Pulang"]').checked = true;
            }
        }

        // Fungsi Ketika Karyawan Klik "OK" pada Modal
        function konfirmasiTipeAbsen() {
            activeTipeAbsensi = selectedModalValue;
            
            // Sembunyikan modal
            document.getElementById('modalTipeAbsen').style.display = "none";

            // Tampilkan info pilihan & aktifkan scanner kamera
            document.getElementById('selectedAbsenInfo').style.display = "block";
            document.getElementById('textTipeTerpilih').innerText = activeTipeAbsensi;
            document.getElementById('labelScanner').style.display = "block";
            document.getElementById('reader').style.display = "block";
            document.getElementById('result').style.display = "none";
            document.getElementById('btnResetScan').style.display = "none";

            initScanner();
        }    </div>
        function onScanSuccess(decodedText, decodedResult) {
            let resultDiv = document.getElementById('result');

            html5QrcodeScanner.clear().catch(err => console.error(err));

            resultDiv.style.display = "block";
            resultDiv.className = "";
            resultDiv.innerText = "Memproses absensi...";

            fetch(WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "absen",
                    idKaryawan: loggedInId,
                    tokenKantor: decodedText,
                    tipeAbsensi: activeTipeAbsensi
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "success") {
                    resultDiv.className = "success";
                    resultDiv.innerText = "Absensi " + activeTipeAbsensi + " atas nama " + loggedInName + " telah tercatat.";
                } else {
                    resultDiv.className = "error";
                    resultDiv.innerText = "Gagal: " + data.message;
                }
                document.getElementById('btnResetScan').style.display = "block";
                muatRiwayatPribadi(loggedInId);
            })
            .catch(error => {
                resultDiv.className = "error";
                resultDiv.innerText = "Gagal mencatat absensi.";
            });
        }

        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: 250 }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        function muatRiwayatPribadi(id) {
            let historyList = document.getElementById('historyList');
            historyList.innerHTML = "Memuat riwayat...";

            fetch(WEB_APP_URL + "?id=" + encodeURIComponent(id))
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) {
                    historyList.innerHTML = "<p style='color: #666; font-size: 14px; text-align: center;'>Belum ada riwayat absen.</p>";
                    return;
                }

                let html = "<b style='font-size: 14px; color: #333;'>Riwayat Terbaru:</b>";
                data.reverse().slice(0, 5).forEach(item => {
                    html += `<div class="history-item">📅 ${item.timestamp} <br>📌 <b>${item.tipeAbsensi}</b> - ${item.namaKaryawan} (${item.idKaryawan})</div>`;
                });
                historyList.innerHTML = html;
            })
            .catch(err => {
                historyList.innerHTML = "<p style='color: red; font-size: 14px;'>Gagal memuat riwayat.</p>";
            });
        }

        function logout() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(e => {});
            }
            localStorage.removeItem("gwk_logged_id");
            localStorage.removeItem("gwk_logged_name");

            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('historySection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginId').value = "";
            document.getElementById('loginPass').value = "";
            document.getElementById('loginError').style.display = "none";
        }
    </script>
</body>
</html>

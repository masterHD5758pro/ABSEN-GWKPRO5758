<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layar QR Code Kantor - GWK-OFFICE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .qr-card {
      background: #fff;
      padding: 34px;
      border-radius: 24px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 360px;
      width: 120%;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .token-text {
      font-size: 13px;
      color: #555;
      word-break: break-all;
      margin-top: 8px;
    }
    .countdown {
      font-weight: bold;
      color: #007bff;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="qr-card">
    <h1>Scan QR Absen GWKPRO5758</h1>
    <p style="color:#666; font-size:14px;">MONGGO SCAN QR Code Absen anggo HPmu dewe Lho.</p>
    <div id="qrcode"></div>
    <div class="countdown">Berganti dalam <span id="timerSec">60</span> detik</div>
    <div class="token-text" id="tokenLabel"></div>
  </div>

  <script>
    const INTERVAL_MS = 60000;
    let lastBlock = null;
    let qrInstance = null;

    function getCurrentBlock() {
      return Math.floor(Date.now() / INTERVAL_MS);
    }

    function renderQrToken() {
      const block = getCurrentBlock();
      const token = "GWK-OFFICE-" + block;
      const container = document.getElementById("qrcode");
      const label = document.getElementById("tokenLabel");

      container.innerHTML = "";
      qrInstance = new QRCode(container, {
        text: token,
        width: 220,
        height: 220
      });
      label.textContent = "Token aktif: " + token;
      lastBlock = block;
    }

    function updateTick() {
      const nowMs = Date.now();
      const block = Math.floor(nowMs / INTERVAL_MS);
      const sisaMs = INTERVAL_MS - (nowMs % INTERVAL_MS);
      const sisaDetik = Math.max(1, Math.ceil(sisaMs / 1000));

      document.getElementById("timerSec").textContent = sisaDetik;

      if (block !== lastBlock) {
        renderQrToken();
      }
    }

    renderQrToken();
    updateTick();
    setInterval(updateTick, 500);
  </script>
</body>
</html>
